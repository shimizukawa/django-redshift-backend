[tox]
envlist =
    py{310,311,312}-dj42
    py{310,311,312,313,314}-dj52
    py{312,313,314}-dj60
    py{312,313,314}-dj61
    lint
    check
skipsdist = True

[gh-actions]
python =
    3.10: py310, lint, check
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[gh-actions:env]
DJANGO =
    4.2: dj42
    5.2: dj52
    6.0: dj60
    6.1: dj61

[testenv]
deps =
    -e .
    coverage
    pytest
    pytest-cov
    mock>=2.0
    django-environ
    dj42: Django==4.2.30
    dj52: Django>=5.2,<5.3
    dj60: Django>=6.0,<6.1
    dj61: Django>=6.1,<6.2
setenv =
    DJANGO_SETTINGS_MODULE = settings
    PYTHONPATH = {toxinidir}
pip_pre = True
commands =
    pytest -v driver_tests {posargs}

[testenv:lint]
basepython = python3
deps=ruff==0.6.2
commands=
    ruff check django_redshift_backend driver_tests
    ruff format --check django_redshift_backend driver_tests

[testenv:format]
basepython = python3
deps=ruff==0.6.2
commands=
    ruff check --fix django_redshift_backend driver_tests
    ruff format django_redshift_backend driver_tests

[testenv:check]
deps = uv
commands =
    uv build --sdist --wheel
    uvx twine check dist/*

[flake8]
max-line-length=120
ignore = W504
exclude = tests/testapp/migrations
